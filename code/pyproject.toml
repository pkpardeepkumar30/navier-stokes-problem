[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "navier-stokes-companion"
version = "0.1.0"
description = "Reproducible scaling studies accompanying a proposed Navier-Stokes construction"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "matplotlib>=3.9,<4",
  "nbformat>=5,<6",
  "nbclient>=0.10,<1",
  "nbconvert>=7,<8",
  "ipykernel>=6,<8",
  "sympy>=1.13,<2",
  "scipy>=1.15,<2",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
